name: PhotoScan CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      shell: bash

    - name: Install dependencies
      run: uv pip install --system -e ".[dev,test,gui]"

    - name: Run Ruff Linter
      run: uv run ruff check . --ignore E501

    - name: Run Pytest Suite
      run: |
        uv run python -m pytest tests/
      shell: bash
      env:
        QT_QPA_PLATFORM: offscreen

  package:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
      shell: bash

    - name: Install packaging dependencies
      run: uv pip install --system -e ".[gui,packaging]"

    - name: Package Binary with PyInstaller
      run: python packaging/build_all.py

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: photoscan-${{ matrix.os }}
        path: dist/
